name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

# Signs with a Developer ID cert, notarizes, staples, and publishes a GitHub
# Release with the DMG and a zipped .app (consumed by the in-app updater).
# Assets are attached to a draft release first and the release is published as
# the final step, so a failed notarization never leaves a half-built release.
# Requires these repository secrets:
#   MACOS_CERT_P12        base64 of your "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD   password for that .p12
#   MACOS_SIGN_ID         e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID              Apple ID email
#   APPLE_TEAM_ID         10-char team id
#   APPLE_APP_PASSWORD    app-specific password for notarytool
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PW=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm cert.p12

      - name: Build, sign, notarize
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make build \
            VERSION="${TAG#v}" \
            SIGN_ID="${{ secrets.MACOS_SIGN_ID }}"
          make release \
            VERSION="${TAG#v}" \
            SIGN_ID="${{ secrets.MACOS_SIGN_ID }}" \
            APPLE_ID="${{ secrets.APPLE_ID }}" \
            TEAM_ID="${{ secrets.APPLE_TEAM_ID }}" \
            APP_PW="${{ secrets.APPLE_APP_PASSWORD }}"
          # Zip of the stapled .app, used by the in-app self-updater.
          ditto -c -k --keepParent dist/WGSplit.app dist/WGSplit.app.zip

      - name: Create draft release with assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/WGSplit.dmg
            dist/WGSplit.app.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
